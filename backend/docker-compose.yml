# Desenvolvimento local: só Postgres e RabbitMQ (a API roda com `dotnet run`, a tela com o Vite).
# Portas fora do padrão para não colidir com outras instalações (spec 004). Valores em backend/.env
# (copie de .env.example); sem o .env, valem os padrões abaixo. Produção: docker-compose.prod.yml na raiz.
services:
  postgres:
    image: postgres:16-alpine
    container_name: hamgueria-postgres
    environment:
      POSTGRES_DB: hamgueria
      POSTGRES_USER: ${POSTGRES_USER:-hamgueria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamgueria123}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hamgueria}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hamgueria-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
