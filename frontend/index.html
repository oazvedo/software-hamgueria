<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Hamgueria &lt;/&gt;</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Theme before the first paint (spec 014): the saved choice, else the system's. Same key as shared/theme.
      ;(function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('hamgueria-theme')
          theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch (e) {}
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
